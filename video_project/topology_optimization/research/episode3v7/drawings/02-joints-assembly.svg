<text x="1398" y="634" font-size="17" fill="#35291f">POST 柱顶 z3630</text>
<text x="1398" y="511" font-size="17" fill="#35291f">DOU 340×340×120 + 140×140×74 坐榫</text>
<text x="1398" y="417" font-size="17" fill="#35291f">GONG_X / Y 640×160×120 交搭口</text>
<text x="1398" y="336" font-size="17" fill="#35291f">CAP 380×380×130</text>
<text x="1398" y="258" font-size="17" fill="#35291f">PURLIN 3380×180×140；四角错口</text>
<text x="930" y="715" font-size="20" fill="#35291f">每层由下层实面承托；拆时先卸屋面和檩，再抬起栱口。</text>
<text x="930" y="753" font-size="20" fill="#35291f">不存在装饰“昂”的虚假受力叙述；镜头只展示实际建成的构件。</text>
<text x="85" y="914" font-size="28" fill="#35291f">C  攒尖座 / 中央短柱 / 十字托梁</text>
<text x="85" y="964" font-size="21" fill="#35291f">HUB 640×640×400；CENTRE_POST 160×160×630；SUPPORT_X/Y 3180×160×140</text>
<text x="85" y="1006" font-size="21" fill="#35291f">四个角梁榫分别落入上开口座；先上方对准，再垂直下落，宝顶最后封口。</text>
<text x="85" y="1048" font-size="21" fill="#35291f">角梁沿真实屋面斜坡，檐部开鸟嘴；44 根椽分别坐在檐檩与角梁 / 攒尖座槽内。</text>
<text x="85" y="1090" font-size="21" fill="#35291f">中间 4 根椽伸入 HUB，十字托梁坐入檐檩，完整的承托路径连续到地面。</text>
<text x="85" y="1132" font-size="21" fill="#35291f">装配检查：assembly-path-qa.json；几何配合：geometry-qa.json；逐件尺寸：cut-list.csv。</text>
<text x="70" y="1208" font-size="20" fill="#35291f">图纸由 pavilion-manifest.json 生成；具体零件外包尺寸见完整 cut-list.csv。</text>
<text x="70" y="1242" font-size="19" fill="#35291f">公开节点原则 + 本模型自定尺寸；为教育性可装配设计，不是经审图的现场施工文件。</text>
<text x="70" y="1273" font-size="17" fill="#35291f">参考：Joint and Peg / Timber Frame Pavilions、Standard Timber Frame Joints；《营造法式》图样仅作传统木构视觉参考。</text>

<text x="85" y="715" font-size="21" fill="#35291f">CROSS_FRONT / BACK：220 × 300；两端榫 280 × 100 × 140</text>
<text x="85" y="753" font-size="21" fill="#35291f">POST 卯口：贯穿柱宽；侧隙 0.8 / 面；销 Ø28，孔 Ø29.6</text>
<text x="85" y="799" font-size="20" fill="#35291f">正确顺序：梁与斜撑先成组 → 两柱沿 X 套入 → 横销锁定</text>
<text x="85" y="835" font-size="20" fill="#35291f">随后两榀沿 Y 合拢套入 LONG_LEFT / RIGHT，再插 Y 向节点销。</text>
<text x="930" y="185" font-size="28" fill="#35291f">B  柱头坐榫 / 栱口 / 承檩</text>
<rect x="1090" y="526" width="160" height="120" fill="#ba8a57" stroke="#654832" stroke-width="2"/>
<rect x="1050" y="445" width="240" height="80" fill="#ba8a57" stroke="#654832" stroke-width="2"/>

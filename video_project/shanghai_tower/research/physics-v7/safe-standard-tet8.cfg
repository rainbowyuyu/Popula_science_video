% Reconstructed isolated tower, SI metre geometry, uniform air inflow.
% Numerical stabilization study. First-order results are not final film data.
SOLVER= INC_RANS
KIND_TURB_MODEL= SA
SA_OPTIONS= NONE
MATH_PROBLEM= DIRECT
RESTART_SOL= NO
INC_DENSITY_INIT= 1.225
INC_VELOCITY_INIT= (30.0, 0.0, 0.0)
INC_NONDIM= INITIAL_VALUES
INC_ENERGY_EQUATION= YES
INC_TEMPERATURE_INIT= 288.15
VISCOSITY_MODEL= CONSTANT_VISCOSITY
MU_CONSTANT= 0.0000181
MARKER_HEATFLUX= (tower, 0.0)
% wall function isolated for smoke
INC_INLET_TYPE= VELOCITY_INLET
MARKER_INLET= (inlet, 288.15, 30.0, 1.0, 0.0, 0.0)
INC_OUTLET_TYPE= PRESSURE_OUTLET
MARKER_OUTLET= (outlet, 0.0)
MARKER_SYM= (sides, ceiling, ground)
MARKER_PLOTTING= (tower, ground)
MARKER_MONITORING= (tower)
REF_ORIGIN_MOMENT_X= 0.0
REF_ORIGIN_MOMENT_Y= 0.0
REF_ORIGIN_MOMENT_Z= 0.0
REF_LENGTH= 632.0
REF_AREA= 61936.0
NUM_METHOD_GRAD= WEIGHTED_LEAST_SQUARES
CFL_NUMBER= 0.5
CFL_ADAPT= NO
CFL_ADAPT_PARAM= (0.5, 1.1, 0.1, 30.0, 0.001, 5)
MGLEVEL= 0
ITER= 3000
CONV_NUM_METHOD_FLOW= FDS
MUSCL_FLOW= NO
SLOPE_LIMITER_FLOW= VENKATAKRISHNAN
VENKAT_LIMITER_COEFF= 0.05
TIME_DISCRE_FLOW= EULER_IMPLICIT
CONV_NUM_METHOD_TURB= SCALAR_UPWIND
MUSCL_TURB= NO
TIME_DISCRE_TURB= EULER_IMPLICIT
LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_PREC= ILU
LINEAR_SOLVER_ERROR= 1e-7
LINEAR_SOLVER_ITER= 100
CONV_FIELD= (RMS_PRESSURE, RMS_VELOCITY-X, RMS_VELOCITY-Y, RMS_VELOCITY-Z, RMS_NU_TILDE)
CONV_RESIDUAL_MINVAL= -7
CONV_STARTITER= 20
MESH_FILENAME= tower.su2
MESH_FORMAT= SU2
TABULAR_FORMAT= CSV
CONV_FILENAME= history
RESTART_FILENAME= restart_flow
VOLUME_FILENAME= flow
SURFACE_FILENAME= surface_flow
OUTPUT_FILES= (RESTART, PARAVIEW_MULTIBLOCK)
OUTPUT_WRT_FREQ= 250
VOLUME_OUTPUT= (COORDINATES, SOLUTION, PRIMITIVE, RESIDUAL)
HISTORY_OUTPUT= (ITER, RMS_RES, AERO_COEFF, LINSOL, CFL_NUMBER)
SCREEN_OUTPUT= (INNER_ITER, RMS_PRESSURE, RMS_VELOCITY-X, RMS_NU_TILDE, DRAG, LIFT)
SCREEN_WRT_FREQ_INNER= 50

MARKER_WALL_FUNCTIONS= (tower, STANDARD_WALL_FUNCTION)
WALLMODEL_KAPPA= 0.41
WALLMODEL_B= 5.5
WALLMODEL_MINYPLUS= 5.0
WALLMODEL_MAXITER= 400
WALLMODEL_RELFAC= 0.1


CFL_REDUCTION_TURB= 0.2

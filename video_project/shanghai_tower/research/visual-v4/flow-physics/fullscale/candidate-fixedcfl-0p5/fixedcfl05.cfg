% Reconstructed isolated tower, SI metre geometry, uniform air inflow.
% Actual-Re resolved-wall RANS for an isolated reconstructed tower; unvalidated until audited.
SOLVER= INC_RANS
KIND_TURB_MODEL= SA
SA_OPTIONS= NONE
MATH_PROBLEM= DIRECT
RESTART_SOL= YES
SOLUTION_FILENAME= ../tower-crown-resolved/restart_flow.dat
INC_DENSITY_INIT= 1.225
INC_VELOCITY_INIT= (30.0, 0.0, 0.0)
INC_NONDIM= INITIAL_VALUES
INC_ENERGY_EQUATION= YES
INC_TEMPERATURE_INIT= 288.15
VISCOSITY_MODEL= CONSTANT_VISCOSITY
MU_CONSTANT= 0.0000181
MARKER_HEATFLUX= (tower, 0.0, ground, 0.0)
% wall function isolated for smoke
INC_INLET_TYPE= VELOCITY_INLET
MARKER_INLET= (inlet, 288.15, 30.0, 1.0, 0.0, 0.0)
INC_OUTLET_TYPE= PRESSURE_OUTLET
MARKER_OUTLET= (outlet, 0.0)
MARKER_SYM= (sides, ceiling)
MARKER_PLOTTING= (tower, ground)
MARKER_MONITORING= (tower)
REF_ORIGIN_MOMENT_X= 0.0
REF_ORIGIN_MOMENT_Y= 0.0
REF_ORIGIN_MOMENT_Z= 0.0
REF_LENGTH= 632.0
REF_AREA= 61936.0
NUM_METHOD_GRAD= GREEN_GAUSS
CFL_NUMBER= 0.5
CFL_ADAPT= NO
% Fixed CFL candidate: no adaptive rebound
MGLEVEL= 0
ITER= 150
CONV_NUM_METHOD_FLOW= FDS
MUSCL_FLOW= YES
SLOPE_LIMITER_FLOW= VENKATAKRISHNAN
VENKAT_LIMITER_COEFF= 0.05
TIME_DISCRE_FLOW= EULER_IMPLICIT
CONV_NUM_METHOD_TURB= SCALAR_UPWIND
MUSCL_TURB= NO
TIME_DISCRE_TURB= EULER_IMPLICIT
LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_PREC= ILU
LINEAR_SOLVER_ERROR= 1E-4
LINEAR_SOLVER_ITER= 100
CONV_FIELD= (RMS_PRESSURE, RMS_VELOCITY-X, RMS_NU_TILDE)
CONV_RESIDUAL_MINVAL= -7
CONV_STARTITER= 20
MESH_FILENAME= ../tower-crown-resolved/tower.su2
MESH_FORMAT= SU2
TABULAR_FORMAT= CSV
CONV_FILENAME= history-fixedcfl05
RESTART_FILENAME= restart_fixedcfl05
VOLUME_FILENAME= flow_fixedcfl05
SURFACE_FILENAME= surface_fixedcfl05
OUTPUT_FILES= (RESTART, PARAVIEW, SURFACE_PARAVIEW)
OUTPUT_WRT_FREQ= (200, 100, 100)
HISTORY_OUTPUT= (ITER, RMS_RES, AERO_COEFF, LINSOL, CFL_NUMBER)
SCREEN_OUTPUT= (INNER_ITER, RMS_PRESSURE, RMS_VELOCITY-X, RMS_NU_TILDE, DRAG, LIFT)
SCREEN_WRT_FREQ_INNER= 20

SPECIFIED_INLET_PROFILE= YES
INLET_FILENAME= ../tower-crown-resolved/inlet.dat
